{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }} — {{ site.title }}{% endblock %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f2231" media="(prefers-color-scheme: dark)">
  {% block meta %}{% endblock %}

  <link rel="icon" href="{% static 'core/favicon/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'core/favicon/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'core/favicon/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'core/favicon/site.webmanifest' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {# The web font loads without blocking rendering; headings fall back to a system serif until then. #}
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..650&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..650&display=swap"></noscript>
  <link rel="stylesheet" href="{% static 'core/css/site.css' %}">
</head>
<body>
  {% block content %}{% endblock %}
  {% include "core/partials/footer.html" %}
</body>
</html>
