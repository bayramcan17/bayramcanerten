<footer class="footer">
  <div class="footer__waves" aria-hidden="true">{% include "core/partials/waves.html" %}</div>
  <div class="footer__inner">
    <p class="footer__note">
      {{ t.not_affiliated }}
      <span aria-hidden="true">·</span> <a href="{{ urls.privacy }}">{{ t.nav.privacy }}</a>
      <span aria-hidden="true">·</span> <a href="{{ urls.support }}">{{ t.nav.support }}</a>
    </p>
    <div class="footer__meta">
      <p>© {% now "Y" %} · <a href="/" lang="tr">{{ site.name }}</a></p>
      <ul class="socials socials--small" role="list">
        {% for social in site.socials %}
          <li>
            <a class="socials__link" href="{{ social.url }}" target="_blank" rel="noopener" aria-label="{{ social.label }}">
              {% include "core/partials/icon.html" with name=social.icon %}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</footer>
